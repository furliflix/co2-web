<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Canvas of Our Own —— 以画为核心的绘画工具">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CO2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1C1C1E">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Canvas of Our Own</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 首屏加载期：3MB 的引擎脚本下载期间不能是一片空白 */
    #co2-loader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #121214; color: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      transition: opacity .25s ease;
    }
    #co2-loader .mark { font-size: 44px; font-weight: 600; letter-spacing: -0.5px; }
    #co2-loader .mark .accent { color: #2997FF; }
    #co2-loader .hint { margin-top: 6px; font-size: 13px; color: #A1A1A6; letter-spacing: .4px; }
    #co2-loader .bar { margin-top: 28px; width: 96px; height: 2px; background: #2C2C2E; border-radius: 2px; overflow: hidden; }
    #co2-loader .bar i { display: block; width: 40%; height: 100%; background: #2997FF; border-radius: 2px; animation: co2-slide 1.1s ease-in-out infinite; }
    @keyframes co2-slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(250%);} }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="co2-loader">
    <div class="mark">CO<span class="accent">2</span></div>
    <div class="hint">Canvas of Our Own</div>
    <div class="bar"><i></i></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter 视图出现后移除加载层；60 秒兜底移除，避免异常时永远挡着。
    (function () {
      var started = Date.now();
      var timer = setInterval(function () {
        var el = document.getElementById('co2-loader');
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
          clearInterval(timer);
          if (el) el.remove();
          return;
        }
        // 超时不要静默移除——白屏比「加载失败」更让人以为坏了。
        if (Date.now() - started > 60000) {
          clearInterval(timer);
          var hint = el && el.querySelector('.hint');
          if (hint) hint.textContent = '加载较慢或失败，下拉刷新重试';
        }
      }, 250);
    })();
  </script>
</body>
</html>
